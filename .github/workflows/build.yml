name: Build and release

# Every push and pull request builds the app on macOS, Windows and Linux.
# Pushing a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`)
# also publishes a GitHub Release with the three downloads attached.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  WAILS_VERSION: v2.10.2

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            platform: darwin/universal
          - name: Windows
            os: windows-latest
            platform: windows/amd64
          - name: Linux
            os: ubuntu-24.04
            platform: linux/amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          echo "C:\\Program Files (x86)\\NSIS" >> "$GITHUB_PATH"

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("wails.json", "utf8"));
            cfg.info.productVersion = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            fs.writeFileSync("wails.json", JSON.stringify(cfg, null, 2) + "\n");
          '

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || VERSION="dev-${GITHUB_SHA::7}"
          LDFLAGS="-X main.version=${VERSION}"
          case "${{ runner.os }}" in
            Windows) wails build -clean -platform ${{ matrix.platform }} -ldflags "$LDFLAGS" -nsis ;;
            Linux)   wails build -clean -platform ${{ matrix.platform }} -ldflags "$LDFLAGS" -tags webkit2_41 ;;
            *)       wails build -clean -platform ${{ matrix.platform }} -ldflags "$LDFLAGS" ;;
          esac

      - name: Package
        run: |
          mkdir -p dist
          cd build/bin
          case "${{ runner.os }}" in
            macOS)
              # Ad-hoc signature so Apple silicon will launch the unsigned app.
              codesign --force --deep --sign - tinier-todo.app
              ditto -c -k --keepParent tinier-todo.app ../../dist/Tinier-Todo-macOS-universal.zip
              ;;
            Windows)
              cp tinier-todo-amd64-installer.exe ../../dist/Tinier-Todo-Windows-x64-setup.exe
              7z a ../../dist/Tinier-Todo-Windows-x64-portable.zip tinier-todo.exe
              ;;
            Linux)
              tar -czf ../../dist/Tinier-Todo-Linux-x64.tar.gz tinier-todo
              ;;
          esac
          ls -la ../../dist

      - uses: actions/upload-artifact@v4
        with:
          name: tinier-todo-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
